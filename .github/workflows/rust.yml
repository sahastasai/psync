name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run the threaded tests (MultiExecutor, Phase II)
      run: cargo test --verbose --no-default-features --features std --test multi --test sync --test targets --lib
    - name: Certificates are up to date with the macro
      run: |
        cargo run -q -p psync-graph --features cli --bin psync-cert -- --facts verify/facts.tsv --expect-unsafe psync-check/tests/fixtures/ tests/graph.rs tests/sync.rs psync-check/tests/fixtures/hidden/app/src/lib.rs examples/graph_suite/*.rs > verify/Certs.lean
        git diff --exit-code verify/Certs.lean
    - name: The book's example reports are what psync prints
      run: ./scripts/check-book-examples.py

  psync-check:
    # `cargo psync check` links rustc's internals; rustup installs the nightly pinned in
    # psync-check/rust-toolchain.toml.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Test the checker on its fixture
      working-directory: psync-check
      run: cargo test --verbose
    - name: The certificates' compiler facts are up to date
      run: |
        ./scripts/cert-facts.sh
        git diff --exit-code verify/facts.tsv

  lean:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Lean
      run: |
        curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.22.0
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
    - name: Check the proofs, the book's Lean tutorial and every certified schedule
      working-directory: verify
      run: lake build PsyncVerify GeneratedCerts
    - name: Log checker against the specs (planted violations)
      run: ./scripts/spec-check/selftest.sh
