[package]
name = "psync"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["psync-graph", "psync-macros"]

[dependencies]
psync-macros = { path = "psync-macros", version = "0.1.0" }

[dev-dependencies]
# For the graph_suite example, which prints the code `#[psync::graph]` generates.
psync-graph = { path = "psync-graph" }
prettyplease = "0.2"
syn = { version = "2", features = ["full"] }

[features]
default = ["rp235x"]
rp235x = ["dep:embedded-alloc", "dep:rp235x-hal", "dep:cortex-m-rt", "dep:cortex-m"]

[target.'cfg(all(target_os = "none", target_arch = "arm"))'.dependencies]
embedded-alloc = { version = "0.7.0", optional = true }
rp235x-hal = { version = "0.4.0", optional = true, features = ["rt", "critical-section-impl"] }
cortex-m-rt = { version = "0.7", optional = true }
cortex-m = { version = "0.7", optional = true }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
